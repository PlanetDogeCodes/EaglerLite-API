<!-- Mod loader patcher (API v1.0)
Give it a standalone Eaglercraft 1.12.2 offline HTML file and it returns the same
game with the mod loader injected. No mods are bundled - import them in-game
(F6 or the Mods button). Only 1.12.2 JS is currently supported (WASM support is planned but not a priority)

BTW I'm really inneficient at coding so if you find a way to make this easier, open a pull request.

And yes, the UI is vibecoded because I'm not spending time on that.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Patcher</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #16181d; color: #e8e8ec; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 48px 16px; }
  .wrap { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 18px; font-weight: 600; }
  section { background: #1e2128; border: 1px solid #2c313c; border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.14em; color: #9aa2b1; }
  p { font-size: 12px; line-height: 1.6; color: #8b93a3; }
  #drop { border: 2px dashed #3a4150; border-radius: 8px; padding: 26px 16px; text-align: center; cursor: pointer; outline: none; }
  #drop.drag { border-color: #3574f0; background: #1b2029; }
  #drop .big { font-size: 13px; color: #e8e8ec; margin-bottom: 4px; }
  #drop .small { font-size: 11px; color: #8b93a3; }
  button { background: #262b35; color: #e8e8ec; border: 1px solid #3a4150; border-radius: 6px; padding: 9px 16px; font: 12px monospace; cursor: pointer; }
  button:hover { background: #2d333f; }
  button.primary { background: #3574f0; border-color: #3574f0; font-weight: 600; }
  button.primary:hover { background: #2b62cf; }
  button:disabled { opacity: 0.45; cursor: default; }
  .row { display: flex; gap: 8px; }
  .status { font: 12px monospace; color: #9aa2b1; min-height: 18px; word-break: break-all; }
  .status.err { color: #ff7b72; }
  .status.ok { color: #7ee48c; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Game Patcher</h1>
  <section>
    <h2>Input</h2>
    <div id="drop" tabindex="0">
      <div class="big">Drop an Eaglercraft 1.12.2 offline HTML file here - JS ONLY</div>
      <div class="small">or click to choose</div>
    </div>
    <input type="file" id="file" accept=".html,.htm,text/html" style="display:none">
    <p>Only previously unmodified 1.12.2 JS clients are supported for now.</p>
  </section>
  <section>
    <h2>Output</h2>
    <div class="row">
      <button class="primary" id="downloadBtn" type="button" disabled>Download Patched HTML :O</button>
      <button id="launchBtn" type="button" disabled>Launch Patched HTML (MAY HAVE ISSUES, IT IS LOADED IN A BLOB LINK)</button>
    </div>
    <div class="status" id="status">Bruh just drop it here already</div>
  </section>
</div>

  runModInit(mod);
  emit('mod:registered', { id: id, name: mod.name });
  if (_winOpen) renderWinList();
  return { id: mod.id, name: mod.name, version: mod.version, author: mod.author, description: mod.description, enabled: mod.enabled, error: mod.error };
};

function runModInit(mod) {
  if (!mod._init || mod._initialized || !mod.enabled) return;
  mod._initialized = true;
  var api = facade(mod);
  mod._facade = api;
  try {
    var ret = mod._init.call(mod, api);
    if (ret && typeof ret.onDisable === 'function') mod._onDisable = ret.onDisable;
    if (ret && typeof ret.onEnable === 'function') mod._onEnable = ret.onEnable;
  } catch (e) {
    mod.error = String(e && e.message ? e.message : e);
    EL.log('mod ' + mod.id + ' failed to load: ' + mod.error);
    emit('mod:error', { id: mod.id, error: mod.error });
  }
}

(function menuKey() {
  var key = (EL.boot.cfg && EL.boot.cfg.menuKey) || 'F6';
  window.addEventListener('keydown', function(e) {
    if (_keyCapturing) return;
    if (insideOurUI(e.target)) return;
    if ((e.code || '') === key) {
      e.preventDefault();
      e.stopPropagation();
      toggleWindow();
    }
  }, true);
})();

(function screenWatch() {
  EL.events.on('game:screen', function() { menuBtnRefresh(); });
  window.addEventListener('resize', function() { menuBtnRefresh(); });
  try { document.addEventListener('fullscreenchange', function() { menuBtnRefresh(); }, false); } catch (eFs) {}
})();

try { Object.defineProperty(window, 'EL', { value: EL, writable: true, configurable: true }); } catch (eG1) { window.EL = EL; }
try { Object.defineProperty(window, 'EaglerLite', { value: EL, writable: true, configurable: true }); } catch (eG2) { window.EaglerLite = EL; }

injectBootMods();

emit('el:ready', { version: OWN, mods: EL.mods.length });
EL.log('EaglerLite Mod API v' + OWN + ' ready (' + EL.mods.length + ' mods)');
return EL;
}
var PATCH_BOOT = {"ver": "3.0", "opts": {"servers": []}, "cfg": {"menuKey": "F6", "inMenuMods": true}};

(function () {
  var drop = document.getElementById('drop');
  var fileInp = document.getElementById('file');
  var dlBtn = document.getElementById('downloadBtn');
  var launchBtn = document.getElementById('launchBtn');
  var statusEl = document.getElementById('status');
  var patched = null;
  var patchedName = 'Patched.html';

  function setStatus(msg, kind) {
    statusEl.textContent = msg;
    statusEl.className = 'status' + (kind ? ' ' + kind : '');
  }

  function handleFile(f) {
    if (!f) return;
    patched = null;
    dlBtn.disabled = true;
    launchBtn.disabled = true;
    setStatus('Reading ' + f.name + ' (' + Math.round(f.size / 1048576) + ' MB)...');
    patchedName = f.name.replace(/\.(html?|htm)$/i, '') + '.modded.html';
    var fr = new FileReader();
    fr.onload = function () {
      try {
        patched = patch(String(fr.result || ''));
        dlBtn.disabled = false;
        launchBtn.disabled = false;
        setStatus('Patched OK - ' + patchedName + ' (' + Math.round(patched.length / 1048576) + ' MB). Download it, or launch a copy now.', 'ok');
      } catch (e) {
        setStatus('Patch failed: ' + (e && e.message ? e.message : e), 'err');
      }
    };
    fr.onerror = function () { setStatus('Could not read the file.', 'err'); };
    fr.readAsText(f);
  }

  function validateGame(html) {
    if (!html || html.length < 2000000) throw new Error('file is too small to be an Eaglercraft client');
    if (html.indexOf('el-modapi') >= 0) throw new Error('this file is already patched');
    if (html.indexOf('eaglercraftXOpts') < 0) throw new Error('no eaglercraftXOpts found - not an EaglercraftX (only 1.12.2 offline clients are supported)');
    if (html.indexOf('1.12.2') < 0) throw new Error('no 1.12.2 marker found - not an Eaglercraft 1.12.2 client');
  }

  function patch(html) {
    validateGame(html);
    var bootJson = JSON.stringify(PATCH_BOOT).replace(/</g, '\\u003c');
    var injection = '<scr' + 'ipt id="el-modapi">(' + EaglerLiteModAPI.toString() + ')(' + bootJson + ');</scr' + 'ipt>\n';
    var m = /<head[^>]*>/i.exec(html);
    if (m) return html.slice(0, m.index + m[0].length) + '\n' + injection + html.slice(m.index + m[0].length);
    m = /<html[^>]*>/i.exec(html);
    if (m) return html.slice(0, m.index + m[0].length) + '\n' + injection + html.slice(m.index + m[0].length);
    return injection + html;
  }

  drop.addEventListener('click', function () { fileInp.click(); });
  drop.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInp.click(); } });
  ['dragenter', 'dragover'].forEach(function (t) {
    drop.addEventListener(t, function (e) { e.preventDefault(); e.stopPropagation(); drop.className = 'drag'; });
  });
  ['dragleave', 'drop'].forEach(function (t) {
    drop.addEventListener(t, function (e) { e.preventDefault(); e.stopPropagation(); drop.className = ''; });
  });
  drop.addEventListener('drop', function (e) {
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
  });
  fileInp.addEventListener('change', function () {
    if (fileInp.files && fileInp.files.length) handleFile(fileInp.files[0]);
    fileInp.value = '';
  });
  dlBtn.addEventListener('click', function () {
    if (!patched) return;
    var blob = new Blob([patched], { type: 'text/html;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = patchedName;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {
      try { document.body.removeChild(a); } catch (e) {}
      try { URL.revokeObjectURL(url); } catch (e) {}
    }, 30000);
  });
  launchBtn.addEventListener('click', function () {
    if (!patched) return;
    var blob = new Blob([patched], { type: 'text/html;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var w = window.open(url, '_blank');
    setTimeout(function () { try { URL.revokeObjectURL(url); } catch (e) {} }, 60000);
    setStatus(w ? 'Launched the patched copy in a new tab.' : 'Pop-up blocked - use Download instead.', w ? 'ok' : 'err');
  });
})();
</script>
</body>
</html>
